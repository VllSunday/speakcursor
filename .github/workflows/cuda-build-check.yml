name: Optional CUDA build check

on:
  push:
    branches:
      - codex/cuda-build-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -C target-feature=+crt-static
      CUDA_ARCH_LIST: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev"]'
      - name: Check Rust Windows application with NVIDIA CUDA
        shell: pwsh
        run: |
          $env:CUDA_PATH = $env:CUDA_PATH.Replace('\', '/')
          $env:CUDA_TOOLKIT_ROOT_DIR = $env:CUDA_PATH
          cargo check --locked --manifest-path prototypes/slint-panels/Cargo.toml --features cuda *> cuda-check.log
          $checkResult = $LASTEXITCODE
          if ($checkResult -ne 0) {
            Get-Content cuda-check.log | Select-String -Pattern 'fatal error|nvcc fatal|CMake Error|error C[0-9]|error MSB[0-9]|error :|#error|unsupported' -Context 0,1 | Select-Object -Last 15 | ForEach-Object {
              Write-Output "::error::$($_.Line) $($_.Context.PostContext -join ' ')"
            }
            Get-Content cuda-check.log -Tail 12
            exit $checkResult
          }
          Get-Content cuda-check.log -Tail 8
