name: Windows dictation preview

on:
  push:
    tags:
      - 'dictation-preview-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test dictation logic
        run: cargo test --locked --manifest-path crates/speakcursor-core/Cargo.toml
      - name: Test dictation pipeline
        run: cargo test --locked --manifest-path crates/speakcursor-dictation/Cargo.toml
      - name: Build Windows application
        run: cargo build --release --locked --manifest-path prototypes/slint-panels/Cargo.toml
      - name: Package executable and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dictation-preview | Out-Null
          Copy-Item target/release/speakcursor-slint-panels.exe dictation-preview/
          Copy-Item prototypes/slint-panels/README.md dictation-preview/
          Compress-Archive -Path dictation-preview/* -DestinationPath speakcursor-windows-dictation.zip
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME speakcursor-windows-dictation.zip --title "SpeakCursor Windows dictation preview" --notes-file prototypes/slint-panels/DICTATION_RELEASE_NOTES.md --prerelease
