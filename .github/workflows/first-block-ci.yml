name: First block checks

on:
  push:
    branches:
      - codex/slint-windows-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-block-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check dictation logic and settings
        run: cargo test --locked --manifest-path crates/speakcursor-core/Cargo.toml
      - name: Check OpenAI client
        run: cargo test --locked --manifest-path crates/speakcursor-cloud/Cargo.toml
      - name: Check microphone capture
        run: cargo test --locked --manifest-path crates/speakcursor-audio/Cargo.toml
      - name: Check encrypted key storage
        run: cargo test --locked --manifest-path crates/speakcursor-windows/Cargo.toml
      - name: Check local history
        run: cargo test --locked --manifest-path crates/speakcursor-history/Cargo.toml
      - name: Check CTranslate2 speech engine
        run: cargo test --locked --manifest-path crates/speakcursor-speech/Cargo.toml
      - name: Check dictation pipeline
        run: cargo test --locked --manifest-path crates/speakcursor-dictation/Cargo.toml
      - name: Check Windows application
        shell: pwsh
        run: |
          cargo check --locked --manifest-path prototypes/slint-panels/Cargo.toml *> windows-check.log
          $checkResult = $LASTEXITCODE
          if ($checkResult -ne 0) {
            Get-Content windows-check.log -Tail 35 | ForEach-Object {
              Write-Output "::error::$($_)"
            }
            exit $checkResult
          }
          Get-Content windows-check.log -Tail 8
      - name: Build Windows executable
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path prototypes/slint-panels/Cargo.toml *> windows-build.log
          $buildResult = $LASTEXITCODE
          if ($buildResult -ne 0) {
            Get-Content windows-build.log -Tail 35 | ForEach-Object {
              Write-Output "::error::$($_)"
            }
            exit $buildResult
          }
          Get-Content windows-build.log -Tail 8
