name: Windows screen help preview

on:
  push:
    tags:
      - 'screen-preview-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test settings and dictation pipeline
        shell: pwsh
        run: |
          cargo test --locked --manifest-path crates/speakcursor-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path crates/speakcursor-cloud/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path crates/speakcursor-dictation/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path prototypes/slint-panels/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        run: cargo build --release --locked --manifest-path prototypes/slint-panels/Cargo.toml
      - name: Package executable and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path screen-preview | Out-Null
          Copy-Item target/release/speakcursor-slint-panels.exe screen-preview/SpeakCursor.exe
          Copy-Item prototypes/slint-panels/QUICK_START.md screen-preview/
          Copy-Item prototypes/slint-panels/SCREEN_TEST.md screen-preview/
          Compress-Archive -Path screen-preview/* -DestinationPath speakcursor-windows-screen-help.zip
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME speakcursor-windows-screen-help.zip --title "SpeakCursor Windows screen help preview" --notes-file prototypes/slint-panels/SCREEN_RELEASE_NOTES.md --prerelease
