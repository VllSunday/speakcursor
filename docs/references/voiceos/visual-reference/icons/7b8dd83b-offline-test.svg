<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">offline-test</title><desc id="desc">A practical offline test</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6f9fe"/><stop offset="1" stop-color="#e9f1fc"/></linearGradient></defs><rect width="1200" height="960" fill="url(#bg)"/><text x="64" y="76" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#526d8b">OFFLINE CHECK</text><text x="60" y="157" font-family="Arial, sans-serif" font-size="52" font-weight="600" fill="#14263e">Test with the network off.</text><rect x="60" y="216" width="1080" height="175" rx="24" fill="#fff" stroke="#dae4ef"/><rect x="84" y="248" width="80" height="80" rx="20" fill="#e9f1ff" stroke="none"/><text x="99" y="300" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#2867c6">01</text><text x="196" y="277" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#14263e">Prepare online</text><text x="196" y="332" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#516277">Download the model and finish setup.</text><rect x="60" y="423" width="1080" height="175" rx="24" fill="#fff" stroke="#dae4ef"/><rect x="84" y="455" width="80" height="80" rx="20" fill="#e9f1ff" stroke="none"/><text x="99" y="507" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#2867c6">02</text><text x="196" y="484" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#14263e">Disconnect</text><text x="196" y="539" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#516277">Turn off Wi-Fi and unplug Ethernet.</text><rect x="60" y="630" width="1080" height="175" rx="24" fill="#fff" stroke="#dae4ef"/><rect x="84" y="662" width="80" height="80" rx="20" fill="#e9f1ff" stroke="none"/><text x="99" y="714" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="#2867c6">03</text><text x="196" y="691" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#14263e">Record something new</text><text x="196" y="746" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#516277">Check that text appears in your local app.</text><text x="64" y="910" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#516277">Repeat for every language and feature you need.</text></svg>
