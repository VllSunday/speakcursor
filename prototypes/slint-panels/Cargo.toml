[package]
name = "speakcursor-slint-panels"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "raw-window-handle-06", "compat-1-18"] }
speakcursor-core = { path = "../../crates/speakcursor-core" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "=1.18.1"
