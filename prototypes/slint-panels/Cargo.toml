[package]
name = "speakcursor-slint-panels"
version = "0.1.0"
edition = "2024"
publish = false

[features]
cuda = ["speakcursor-speech/cuda"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "raw-window-handle-06", "compat-1-18"] }
speakcursor-core = { path = "../../crates/speakcursor-core" }
speakcursor-windows = { path = "../../crates/speakcursor-windows" }
speakcursor-history = { path = "../../crates/speakcursor-history" }

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
speakcursor-audio = { path = "../../crates/speakcursor-audio" }
speakcursor-dictation = { path = "../../crates/speakcursor-dictation" }
speakcursor-cloud = { path = "../../crates/speakcursor-cloud" }
speakcursor-speech = { path = "../../crates/speakcursor-speech" }
tray-icon = { version = "0.26.1", default-features = false }
rfd = { version = "0.17.2", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"
